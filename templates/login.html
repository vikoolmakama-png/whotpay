<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | WHOT PAY</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080808;color:white;
font-family:Arial,sans-serif;display:flex;align-items:center;
justify-content:center;padding:20px}
.box{width:100%;max-width:390px;padding:30px 24px;
background:linear-gradient(145deg,#181012,#0d0d0d);
border:1px solid #ff26383b;border-radius:18px;
box-shadow:0 0 35px #ff263815}
.logo{text-align:center;font-size:29px;font-weight:900;
text-shadow:0 0 15px #ff26384c}
.logo span{color:#ff3448}
h2{text-align:center;margin-top:25px}
p{text-align:center;color:#999;font-size:13px;line-height:1.7}
label{display:block;font-size:12px;margin:18px 0 8px}
input{width:100%;padding:14px;background:#080808;color:white;
border:1px solid #333;border-radius:9px;outline:none}
input:focus{border-color:#ff3448;box-shadow:0 0 12px #ff263820}
button{width:100%;padding:15px;margin-top:25px;border:0;
border-radius:9px;background:linear-gradient(135deg,#ff4353,#d90019);
color:white;font-weight:bold}
a{color:#ff5263;text-decoration:none}
.error{color:#ff7580}
.success{color:#72ffad}
</style>
</head>
<body>
<div class="box">
  <div class="logo">WHOT<span> PAY</span></div>
  <h2>Welcome Back</h2>
  <p>Log in to access your account.</p>

  {% if success %}
  <p class="success">Account created successfully. Please log in.</p>
  {% endif %}

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">LOGIN →</button>
  </form>

  <p>Don't have an account? <a href="/register">Register</a></p>
  <p><a href="/">← Back to home</a></p>
</div>
</body>
</html>
