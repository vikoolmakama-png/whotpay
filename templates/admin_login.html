<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whot Pay Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:20px}
.box{width:100%;max-width:390px;background:#151010;border:1px solid #7d1717;border-radius:18px;padding:28px;box-shadow:0 0 28px #8b101044}
h1{color:#ff3838;text-align:center;margin:0 0 8px}.sub{text-align:center;color:#aaa;margin-bottom:24px}
label{display:block;margin:15px 0 7px;color:#ddd}input{width:100%;padding:13px;border-radius:9px;border:1px solid #533030;background:#090909;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:9px;background:#e51d2a;color:white;font-weight:bold;font-size:16px}
.error{color:#ff7777;background:#351313;padding:10px;border-radius:8px}
</style>
</head>
<body><main class="box">
<h1>🔐 WHOT PAY</h1><div class="sub">Administrator Login</div>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login">
<label>Admin username</label><input name="username" required autocomplete="username">
<label>Admin password</label><input type="password" name="password" required autocomplete="current-password">
<button type="submit">Login to Admin Dashboard</button>
</form>
</main></body></html>
