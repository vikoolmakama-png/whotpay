services:
  - type: web
    name: whotpay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whotpay-db
          property: connectionString
      - key: WHOTPAY_SECRET
        generateValue: true

databases:
  - name: whotpay-db
    databaseName: whotpay
    user: whotpay
